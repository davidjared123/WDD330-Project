<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Products</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/product-list.js"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="breadcrumbs"></div>
      <section class="products">
        <h2 class="category-title">Products</h2>
        <div class="sort-options" style="margin-bottom: 20px;">
          <label for="sort-by">Sort by:</label>
          <select id="sort-by">
            <option value="name">Name</option>
            <option value="price">Price</option>
          </select>
        </div>
        <ul class="product-list">
        </ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
